name: Apply sync reconciliation v2 fixed

on:
  push:
    branches:
      - sync-reconciliation-v2

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-reconciliation-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic patch
        run: node scripts/apply-sync-reconciliation-v2.mjs
      - name: Syntax check
        run: |
          node --check cloud.js
          node --check app.js
          node --check service-worker.js
      - name: Repository smoke checks
        run: |
          test -s cloud.js
          test -s app.js
          test -s service-worker.js
          grep -q "detectSyncIssues(localGameMap, tombstoneMap, remoteMap, outbox" cloud.js
          grep -q "v28-sync-reconciliation" service-worker.js
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud.js service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "Simplify cloud reconciliation and conflict handling"
            git push origin HEAD:sync-reconciliation-v2
          fi
